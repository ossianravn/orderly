[project]
name = "orderly"
version = "0.1.0"
description = "Orderly: a geometric grotesk typeface drawn in code"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "fonttools[ufo,unicode]==4.68.0",
    "ufoLib2==0.19.1",
    "fontc==2.0.1",
    "skia-python==144.1",
    "playwright==1.65.2",
    "brotli==1.2.1",
]

[project.scripts]
orderly = "orderly.cli:main"

[build-system]
requires = ["uv_build>=0.8.15,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "sources"
module-name = "orderly"

[dependency-groups]
qa = [
    "fontbakery==1.1.0",
    "glyphsets==1.1.3",
    "hyperglot==0.8.2",
]
